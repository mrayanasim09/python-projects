[metadata]
name = python-projects
version = 1.0.0
author = MRayan Asim
author_email = mrayanasim09@gmail.com
description = A collection of 80+ practical Python projects for developers of all skill levels
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
url = https://github.com/mrayanasim09/python-projects
project_urls =
    Documentation = https://mrayans.gitbook.io/python--projects/
    Source = https://github.com/mrayanasim09/python-projects.git
    Tracker = https://github.com/mrayanasim09/python-projects/issues
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Intended Audience :: Education
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Education
    Topic :: Games/Entertainment
    Topic :: Multimedia :: Graphics
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Software Development :: Libraries
    Topic :: Utilities
keywords =
    python
    projects
    learning
    education
    gui
    games
    calculators
    machine-learning
    utilities

[options]
packages = find:
python_requires = >=3.10
include_package_data = True
zip_safe = False

[options.packages.find]
include =
    Calculator*
    Game*
    GUI*
    Utilities*
    machine_learning*

[options.extras_require]
dev =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    black>=23.0.0
    flake8>=6.1.0
    mypy>=1.5.0
    bandit>=1.7.0
    isort>=5.12.0
    pre-commit>=3.6.0
test =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    pytest-mock>=3.12.0

[flake8]
max-line-length = 100
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info,
    .pytest_cache,
    .venv,
    venv
per-file-ignores =
    */__init__.py: F401, F403

[tool:pytest]
testpaths = Utilities
python_files = test_*.py
python_functions = test_*
addopts = -v --cov=Utilities --cov-report=term-missing

[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
exclude = (machine_learning|GUI|Game)/

[coverage:run]
source = Utilities
omit = 
    */test_*.py
    */__init__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
