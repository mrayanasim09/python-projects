[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-projects"
version = "1.0.0"
description = "A modular collection of Python applications, desktop utilities, algorithms, and computer vision experiments."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MRayan Asim", email = "mrayanasim09@gmail.com" }]

# Core runtime deps (API only — all others are optional extras)
dependencies = [
    "requests>=2.31.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
    # Snyk-pinned transitive security patches
    "fonttools>=4.63.0",
    "holidays>=0.45",
    "zipp>=4.1.0",
    "nltk>=3.10.3",
    "protobuf>=7.35.1",
    "urllib3>=2.7.0",
    "starlette>=1.6.0",
    "soupsieve>=2.8.4",
]

[project.optional-dependencies]
gui = [
    "PyQt5>=5.15.9",
    "PyQtWebEngine>=5.15.6",
    "pillow>=10.0.0",
    "tkcalendar>=1.6.1",
    "pyshorteners>=1.0.1",
    "googlesearch-python>=1.3.0",
    "openpyxl>=3.1.5",
    "sympy>=1.12",
    "hijri-converter>=2.3.2.post1",
]
games = [
    "pygame>=2.6.1",
]
ml = [
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "scikit-learn>=1.7.2",
    "numpy>=1.26.0",
    "textblob>=0.17.1",
    "vaderSentiment>=3.3.2",
    "langdetect>=1.0.9",
    "screen-brightness-control>=0.27.2",
    "seaborn>=0.13.2",
    "matplotlib>=3.8.0",
    "pyttsx3>=2.90",
    "prophet>=1.1.5",
    "yfinance>=0.2.28",
]
automation = [
    "pyautogui>=0.9.54",
    "qrcode>=8.2",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.16.3",
    "mypy>=1.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["Calculator", "GUI", "Game", "Utilities", "machine_learning"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "UP",  # pyupgrade
]
ignore = [
    "S101",  # assert statements (needed in tests)
    "S311",  # pseudo-random generators (educational use)
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform calls in argument defaults
    "F403",  # star imports in legacy scripts
    "F405",  # name from star import in legacy scripts
    "F821",  # undefined names in legacy scripts
    "E402",  # import not at top of file
    "E722",  # bare except in legacy scripts
    "F841",  # unused variable in legacy scripts
    "B007",  # loop control variable not used
    "S603",  # subprocess without shell=True
    "S607",  # start process with partial path
    "S324",  # md5 used for educational hash cracking
    "B028",  # warnings without stacklevel
    "UP031", # printf string formatting in legacy scripts
    "E711",  # comparison to None in legacy scripts
    "E712",  # comparison to True in legacy scripts
    "W291",  # trailing whitespace in legacy docstrings
    "W293",  # whitespace in blank line in legacy docstrings
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "B"]
"Calculator/sudoku.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.vercel]
entrypoint = "api.app:app"
